  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #000000, #1a1a2e, #16213e, #0f3460);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 380px;
    }

    .ad-box-native {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .btn-generar {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
      transition: all 0.3s ease;
      outline: none;
      width: 100%;
    }

    .btn-generar:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(56, 239, 125, 0.6);
    }

    .btn-generar:active {
      transform: scale(0.98);
    }

    .mensaje-exito {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #e8faf1;
      border: 2px solid #38ef7d;
      border-radius: 12px;
      color: #1b7a42;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .mensaje-exito p {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .emoji-carita {
      font-size: 3rem;
      display: inline-block;
      animation: bounce 1s infinite alternate;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <audio id="reproductorMusica" preload="auto" style="display: none;"></audio>

  <script>
    const jsonUrl = "https://raw.githubusercontent.com/refinadorlegendary-rgb/Dip.o.p/refs/heads/main/jsskk.json";
    let listaAudios = [];
    const reproductor = document.getElementById('reproductorMusica');

    // Smartlink de Monetización
    const smartlinkUrl = "Https://www.profitableratecpmnetwork.com/pturcs26dn?key=8f131cf1329a4e8bcd4546371dde05ec";

    function extraerURLsDeObjeto(data) {
      let urls = [];
      if (typeof data === 'string') {
        if (data.startsWith('http://') || data.startsWith('https://')) {
          urls.push(data);
        }
      } else if (Array.isArray(data)) {
        data.forEach(item => {
          urls = urls.concat(extraerURLsDeObjeto(item));
        });
      } else if (typeof data === 'object' && data !== null) {
        Object.values(data).forEach(val => {
          urls = urls.concat(extraerURLsDeObjeto(val));
        });
      }
      return urls;
    }

    function formatearUrlUniversal(url) {
      if (url.includes('archive.org')) {
        return url.replace('/details/', '/download/');
      }
      return url;
    }

    fetch(jsonUrl)
      .then(res => res.json())
      .then(data => {
        let urlsEncontradas = extraerURLsDeObjeto(data);
        listaAudios = urlsEncontradas.map(formatearUrlUniversal);
      })
      .catch(err => {
        console.error("Error al obtener la lista JSON:", err);
      });

    function reproducirAudioAleatorio() {
      if (listaAudios.length === 0) return;

      const indice = Math.floor(Math.random() * listaAudios.length);
      const audioElegido = listaAudios[indice];

      reproductor.src = audioElegido;
      reproductor.currentTime = 0;
      
      const playPromise = reproductor.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("Error al reproducir audio:", error);
        });
      }
    }

    function copiarEnlace(urlACopiar, idMensaje) {
      document.querySelectorAll('.mensaje-exito').forEach(msg => msg.style.display = 'none');

      if (!urlACopiar) {
        alert("Esta casilla aún no tiene un enlace asignado.");
        return;
      }

      // 1. Copiar el enlace al portapapeles
      navigator.clipboard.writeText(urlACopiar).then(() => {
        // 2. Mostrar el mensaje de éxito
        const mensaje = document.getElementById(idMensaje);
        mensaje.style.display = 'block';

        // 3. Reproducir audio
        reproducirAudioAleatorio();

        // 4. Abrir la publicidad en una pestaña nueva
        window.open(smartlinkUrl, '_blank');
      }).catch(err => {
        console.error('Error al copiar el enlace: ', err);
      });
    }
  </script>
